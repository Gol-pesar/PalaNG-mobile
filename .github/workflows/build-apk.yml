name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VER_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "$MAJOR_VERSION" = "1" ]; then
            REST="${RAW_VERSION#1.}"
            MAJOR_VERSION="${REST%%.*}"
          fi

          if ! printf '%s' "$MAJOR_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "::error::Failed to parse Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION} (${RAW_VERSION})."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists at ./debug.keystore."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool was not found in configured Java 17 installation (${JAVA_HOME})."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              >/dev/null 2>&1
            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Created temporary debug keystore."
          fi

      - name: Download native libv2ray.aar dependency
        run: |
          set -euo pipefail
          mkdir -p app/libs
          if [ ! -s "app/libs/libv2ray.aar" ]; then
            echo "Downloading libv2ray.aar (v5.56.0)..."
            curl -fsSL --retry 3 --retry-delay 2 \
              -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibV2rayLite/releases/download/v5.56.0/libv2ray.aar"
          fi
          if [ ! -s "app/libs/libv2ray.aar" ]; then
            echo "::error::Failed to download app/libs/libv2ray.aar."
            exit 1
          fi
          echo "Verified app/libs/libv2ray.aar ($(wc -c < app/libs/libv2ray.aar) bytes)."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::${APK_PATH} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::${APK_PATH} is empty (0 bytes)."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::${APK_PATH} does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK at ${APK_PATH} ($(wc -c < "$APK_PATH") bytes)."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified source APK missing before preparing release asset."
            exit 1
          fi

          RAW_REPO="${REPO_NAME:-${GITHUB_REPOSITORY#*/}}"
          SAFE_REPO="$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$ASSET_DIR"
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to copy debug APK to release asset path."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on the runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release asset is missing or empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not end with .apk."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(printf '%s\n' \
            "This is an automatically generated debug APK." \
            "" \
            "- Built by: GitHub Actions" \
            "- Run number: ${GITHUB_RUN_NUMBER}" \
            "- Run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- Purpose: Intended for testing only (not a Google Play Store production release)" \
            "- Signing: Signed only with a temporary debug keystore")"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK asset filename: ${ASSET_NAME}"
            gh release view "$RELEASE_TAG"

            {
              echo "### Debug APK Published"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset:** \`${ASSET_NAME}\`"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo ""
              echo "You can download \`${ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Publishing to GitHub Releases failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            echo "APK build succeeded. Backup artifact: app-debug-apk"

            {
              echo "### Debug APK Built (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- The debug APK build **succeeded**."
              echo "- Download the APK from the GitHub Actions artifact named \`app-debug-apk\` in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
